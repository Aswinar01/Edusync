# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=edusync

# Multipart Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.connect-timeout-ms=5000
gemini.api.read-timeout-ms=15000

# Source Verification Configuration
verification.source.base-url=${AUTHORITATIVE_API_BASE_URL:https://endoflife.date/api}
verification.source.connect-timeout-ms=5000
verification.source.read-timeout-ms=10000
verification.source.allowed-domains=endoflife.date
verification.source.user-agent=EduSync/1.0 (Study Material Verification Engine)
